[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamokv"
version = "1.0.0"
description = "A Dynamo-style distributed key-value store with a deterministic fault-injection simulator"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Puneeth Kompally" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
plots = ["matplotlib>=3.7"]

[project.scripts]
dynamokv = "dynamokv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["dynamokv.config.Config", "dynamokv.sim.WorkloadSettings", "Config", "WorkloadSettings"]
